<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="墨西哥料理西班牙文練習：料理圖鑑、發音練習、實戰點餐闖關">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Buen Provecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: painted-wall taquería — papel picado header, sticky tab bar, one centered column of cards and a game stage */
:root{
  --bg:#EEF5F1; --surface:#FFFFFF; --surface-2:#F6FAF8; --ink:#1F1A2E; --muted:#5D6472; --line:#D3E0D9;
  --rosa:#C41C63; --rosa-soft:#FBE2EC; --sol:#D98A00; --sol-soft:#FDF0D2; --verde:#137C65; --verde-soft:#DBF0E8;
  --chile:#C42B2B; --chile-soft:#FBE3E1; --plate:#FAFAF5; --plate-rim:#D9D9CE; --on-accent:#FFFFFF;
  --f-display:"Bungee", "Impact", "Arial Black", sans-serif;
  --f-body:"Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111C; --surface:#211A2B; --surface-2:#1B1524; --ink:#F4EEF6; --muted:#ABA3B8; --line:#352C42;
  --rosa:#FF5C9C; --rosa-soft:#3B1E2F; --sol:#FFB632; --sol-soft:#3A2D14; --verde:#3FCBA5; --verde-soft:#16312A;
  --chile:#FF6E61; --chile-soft:#3A1C1C; --plate:#ECEAE2; --plate-rim:#BAB7AC; --on-accent:#1A1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111C; --surface:#211A2B; --surface-2:#1B1524; --ink:#F4EEF6; --muted:#ABA3B8; --line:#352C42;
  --rosa:#FF5C9C; --rosa-soft:#3B1E2F; --sol:#FFB632; --sol-soft:#3A2D14; --verde:#3FCBA5; --verde-soft:#16312A;
  --chile:#FF6E61; --chile-soft:#3A1C1C; --plate:#ECEAE2; --plate-rim:#BAB7AC; --on-accent:#1A1220; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.es{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.1}
.muted{color:var(--muted)}
.label{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.picado{height:46px;overflow:hidden;display:flex;justify-content:center}
.picado svg{flex:none}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.3rem);color:var(--rosa);line-height:1}
.brand h1 small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-top:6px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;background:none;border:0;padding:12px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab span{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8}
.tab[aria-selected="true"]{color:var(--rosa);border-bottom-color:var(--rosa)}
main{padding-block:22px 60px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.view-head h2{font-size:1.45rem}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:800;background:var(--rosa);color:var(--on-accent);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sol{background:var(--sol);color:#1F1A2E}
.btn.verde{background:var(--verde);color:var(--on-accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--rosa)}
.iconbtn svg{width:20px;height:20px}

/* filters + grid */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px -12px rgba(0,0,0,.35)}
.card .art{background:var(--surface-2);border-radius:10px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.card .art svg{width:100%;height:100%}
.card .es{font-size:1.02rem;margin-top:6px;color:var(--ink)}
.card .zh{font-weight:700;color:var(--muted);font-size:.92rem}
.card .play{position:absolute;top:16px;right:18px;width:34px;height:34px}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--verde)}

/* dialog */
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,10,25,.55)}
.dlg-art{background:var(--surface-2);aspect-ratio:16/10;display:grid;place-items:center;position:relative}
.dlg-art svg{width:78%;height:100%}
.dlg-body{padding:18px 22px 22px;display:grid;gap:14px}
.dlg-close{position:absolute;top:12px;right:12px}
.syl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.syl b,.syl i{font-style:normal;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:1.05rem}
.syl b{background:var(--rosa-soft);border-color:var(--rosa);color:var(--rosa)}
.syl .gap{width:8px}
.tipbox{background:var(--sol-soft);border-radius:12px;padding:12px 14px;font-size:.95rem}
.tipbox strong{color:var(--sol)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.meta div{display:grid}
.meta b{font-variant-numeric:tabular-nums}

/* practice */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.prac-start{display:grid;gap:18px;grid-template-columns:1.2fr 1fr}
@media (max-width:720px){.prac-start{grid-template-columns:1fr}}
.queue{display:flex;flex-wrap:wrap;gap:6px}
.qpill{padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.85rem;font-weight:700}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start}
.mode .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--verde-soft);color:var(--verde);font-weight:800;font-size:.85rem}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:var(--verde);transition:width .3s}
.qcard{display:grid;gap:16px;justify-items:center;text-align:center;max-width:560px;margin:0 auto}
.qcard .art{width:min(260px,70vw);aspect-ratio:4/3;max-width:100%}
.qcard .prompt{font-size:1.1rem;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:700;text-align:left;min-width:0;transition:background .15s,border-color .15s}
.opt:hover:not([disabled]){border-color:var(--rosa)}
.opt.ok{background:var(--verde-soft);border-color:var(--verde)}
.opt.bad{background:var(--chile-soft);border-color:var(--chile)}
.opt[disabled]{cursor:default}
.opt small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
.spell{display:flex;gap:8px;width:100%}
.spell input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.feedback{font-weight:700;min-height:1.5em}
.feedback.ok{color:var(--verde)} .feedback.bad{color:var(--chile)}
.rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.summary-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.summary-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}

/* simulation: locations */
.locs{display:grid;gap:12px}
.loc{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.loc[disabled]{opacity:.55;cursor:not-allowed}
.loc .badge{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:1.6rem}
.loc h3{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.loc p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.stars{display:flex;gap:2px;color:var(--sol)}
.stars svg{width:18px;height:18px}
.stars .off{color:var(--line)}
@media (max-width:480px){.loc{grid-template-columns:56px 1fr}.loc .badge{width:56px;height:56px;font-size:1.2rem}.loc .stars{grid-column:2}}

/* simulation: stage */
.stage{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.mission{background:var(--sol-soft);border:2px dashed var(--sol);border-radius:16px;padding:16px;display:grid;gap:8px;position:sticky;top:70px}
@media (max-width:760px){.mission{position:static}}
.mission h3{font-family:var(--f-display);font-weight:400;font-size:1rem;color:var(--sol)}
.mission ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.mission li.done{text-decoration:line-through;opacity:.6}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hearts{display:flex;gap:4px}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.18;filter:grayscale(1)}
.timer{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--sol);width:100%}
.timer i.low{background:var(--chile)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-height:300px;align-content:start}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--sol-soft)}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;min-width:0}
.msg.me .bubble{background:var(--rosa);color:var(--on-accent);border-color:var(--rosa);border-radius:16px 16px 4px 16px}
.bubble .t{font-weight:800;font-size:1.05rem}
.bubble .z{font-size:.88rem;opacity:.8;margin-top:2px}
.bubble .who{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.bubble .redo{margin-top:6px;background:none;border:0;padding:0;color:var(--rosa);font-weight:800;font-size:.85rem;display:inline-flex;gap:4px;align-items:center}
.msg.me .bubble .redo{color:var(--on-accent)}
.hidden-sub{filter:blur(6px);user-select:none}
.event{text-align:center;font-weight:800;color:var(--chile);background:var(--chile-soft);border-radius:12px;padding:8px}
.combo{font-family:var(--f-display);color:var(--rosa);font-size:1rem}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.receipt{max-width:380px;margin:0 auto;background:var(--plate);color:#22202A;border-radius:6px;padding:22px 20px 26px;font-variant-numeric:tabular-nums;box-shadow:0 18px 30px -18px rgba(0,0,0,.5);position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at bottom,transparent 98%,#000) 50% 100%/18px 100% repeat-x}
.receipt h3{font-family:var(--f-display);font-weight:400;text-align:center;font-size:1.3rem;color:#C41C63}
.receipt .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #BDBAAF;padding:6px 0;font-size:.95rem}
.receipt .tot{font-weight:800;font-size:1.1rem;border-bottom:0}
.receipt .stars{justify-content:center;margin:10px 0}
.receipt .stars svg{width:34px;height:34px}
.receipt .stars .off{color:#D5D2C6}
.receipt .muted{color:#5d5a66}

/* passport */
.pass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sticker{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-size:.75rem;font-weight:700}
.sticker svg{width:100%;aspect-ratio:4/3;height:auto}
.sticker.locked svg{filter:grayscale(1) opacity(.3)}
.sticker.locked{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--rosa);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:18px}
.bdg{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bdg .seal{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--verde-soft);color:var(--verde);font-family:var(--f-display)}
.bdg.locked{opacity:.5}
.bdg.locked .seal{background:var(--surface-2);color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="picado" id="picado" aria-hidden="true"></div>
  <div class="brand wrap">
    <h1>¡Buen Provecho!<small>墨西哥料理西班牙文 · 圖鑑、發音、實戰點餐</small></h1>
    <div class="stats" id="stats"></div>
  </div>
</header>
<nav class="tabs" aria-label="主選單">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-v="menu" aria-selected="true">料理圖鑑<span>El menú</span></button>
    <button class="tab" role="tab" data-v="practica" aria-selected="false">發音練習<span>Pronunciación</span></button>
    <button class="tab" role="tab" data-v="pedir" aria-selected="false">實戰點餐<span>¡A pedir!</span></button>
    <button class="tab" role="tab" data-v="pasaporte" aria-selected="false">我的護照<span>Pasaporte</span></button>
  </div>
</nav>
<main class="wrap">
  <section id="v-menu"></section>
  <section id="v-practica" hidden></section>
  <section id="v-pedir" hidden></section>
  <section id="v-pasaporte" hidden></section>
</main>
<dialog id="dlg"></dialog>

<script>
/* ---------------- data ---------------- */
const CATS={tacos:'塔可 Tacos',platos:'主菜 Platos fuertes',desayuno:'早餐 Desayuno',antojitos:'小吃 Antojitos',postres:'甜點 Postres',bebidas:'飲料 Bebidas'};
const D=[
{id:'pastor',es:'Tacos al pastor',zh:'鳳梨烤肉塔可',cat:'tacos',syl:'TA·cos al pas·TOR',price:80,region:'墨西哥城',u:['una orden de tacos al pastor','órdenes de tacos al pastor'],art:{t:'taco',m:'#C8432B',x:'pina'},
desc:'黎巴嫩移民帶來的直立烤肉，在墨西哥換成用辣椒和胭脂樹籽醃紅的豬肉，頂端插一顆鳳梨。師傅一刀削肉、一刀彈鳳梨進餅裡，再加洋蔥和香菜。',
tip:'pastor 的重音在最後：pas-TOR。字尾的 r 舌尖輕彈一下就好。al pastor 意思是「牧羊人風格」。',hint:'頂端插著鳳梨、用紅色醃料烤的直立豬肉塔可'},
{id:'carnitas',es:'Tacos de carnitas',zh:'慢燉豬肉塔可',cat:'tacos',syl:'TA·cos de car·NI·tas',price:85,region:'米卻肯州',u:['una orden de tacos de carnitas','órdenes de tacos de carnitas'],art:{t:'taco',m:'#B07A3E'},
desc:'整隻豬的各部位放進大銅鍋，用豬油慢慢燉到外酥內嫩，切碎後包進玉米餅，擠點萊姆、加青醬最對味。',
tip:'carnitas = carne（肉）+ -itas（小小的），重音在 NI。d 在母音中間很輕，de 接近「ㄉㄝ」帶點氣音。',hint:'用豬油在大銅鍋裡慢燉、外酥內嫩的豬肉塔可'},
{id:'birria',es:'Tacos de birria',zh:'紅燉肉沾湯塔可',cat:'tacos',syl:'TA·cos de BI·rria',price:95,region:'哈利斯科州',u:['una orden de tacos de birria','órdenes de tacos de birria'],art:{t:'taco',m:'#8E2A1E',x:'consome'},
desc:'用辣椒和香料把山羊肉或牛肉燉到軟爛，玉米餅沾過紅油煎脆，旁邊附一碗燉肉湯（consomé）讓你沾著吃。',

/* ---------------- storage ---------------- */
const KEY='buen-provecho-v1';
function blank(){return{m:{},pesos:0,stars:{},runs:0,perfect:0,streak:{last:'',n:0},sessions:0,subs:true}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const mast=id=>S.m[id]||0;
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function markDay(){const t=today();if(S.streak.last===t)return;const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak.n=(S.streak.last===ys)?S.streak.n+1:1;S.streak.last=t;save()}
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);

/* ---------------- speech ---------------- */
let esVoice=null;const hasTTS='speechSynthesis' in window;
function loadVoices(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();
  esVoice=vs.find(v=>/es[-_]MX/i.test(v.lang))||vs.find(v=>/es[-_](US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(text,rate=0.92,onend){if(!hasTTS){onend&&onend();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-MX';if(esVoice)u.voice=esVoice;u.rate=rate;
  let done=false;const fin=()=>{if(!done){done=true;onend&&onend()}};u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(2500,text.length*110/rate));speechSynthesis.speak(u)}catch(e){onend&&onend()}}
const canListen=()=>hasTTS;

function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function scatter(cx,cy,rx,ry,colors,n,size,seed=7,shape='c'){const r=rng(seed);let s='';for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r());const x=(cx+Math.cos(a)*rx*d).toFixed(1),y=(cy+Math.sin(a)*ry*d).toFixed(1);const c=colors[i%colors.length];
  s+=shape==='c'?`<circle cx="${x}" cy="${y}" r="${size}" fill="${c}"/>`:`<rect x="${x}" y="${y}" width="${size*1.6}" height="${size*1.6}" rx=".6" fill="${c}" transform="rotate(${Math.round(r()*90)} ${x} ${y})"/>`}return s}

/* ---------------- shared helpers ---------------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-zñ ]/g,'').replace(/\s+/g,' ').trim()}
function sylHTML(d){return d.syl.split(' ').map(w=>w.split('·').map(p=>p===p.toUpperCase()&&p.length>0&&/[A-ZÉ]/.test(p)?`<b>${p.toLowerCase()}</b>`:`<i>${p}</i>`).join('')).join('<span class="gap"></span>')}
function dotsHTML(n){let s='<div class="dots" aria-label="熟練度 '+n+'/5">';for(let i=0;i<5;i++)s+=`<i class="${i<n?'on':''}"></i>`;return s+'</div>'}
function starsHTML(n,max=3){let s='<div class="stars">';for(let i=0;i<max;i++)s+=`<span class="${i<n?'':'off'}">${IC.star}</span>`;return s+'</div>'}
let toastT;function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function addPesos(n){S.pesos+=n;save();renderStats()}

const UNITS=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const TENS=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const HUND=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function numEs(n){if(n<30)return UNITS[n];if(n<100){const t=Math.floor(n/10),u=n%10;return TENS[t]+(u?' y '+UNITS[u]:'')}
  if(n===100)return 'cien';if(n<1000){const h=Math.floor(n/100),r=n%100;return HUND[h]+(r?' '+numEs(r):'')}
  const th=Math.floor(n/1000),r=n%1000;return (th===1?'mil':numEs(th)+' mil')+(r?' '+numEs(r):'')}

  <div class="panel prac-start"><div style="display:grid;gap:14px;align-content:start"><div class="label">這回合會練到</div><div class="queue">${q.map(d=>`<span class="qpill">${d.es}</span>`).join('')}</div>
  <div class="row"><button class="btn" id="startP">開始練習</button><span class="muted" style="font-size:.9rem">每題答對 +5 披索</span></div></div>
  <div class="modes"><div class="label">四種題型，依熟練度出題</div>
  <div class="mode"><span class="n">1</span><div><b>聽音辨菜</b><br><span class="muted">聽西班牙文，選出是哪道菜</span></div></div>
  <div class="mode"><span class="n">2</span><div><b>看中文選西文</b><br><span class="muted">看中文名和插圖，選正確的西班牙文</span></div></div>
  <div class="mode"><span class="n">3</span><div><b>跟讀練習</b><br><span class="muted">聽完照著音節大聲唸三次，再自我評分</span></div></div>
  <div class="mode"><span class="n">4</span><div><b>拼字挑戰</b><br><span class="muted">熟練後聽音拼出完整西文（重音符號可省略）</span></div></div></div></div>`;
  $('#startP').onclick=()=>{P={q:q.map(d=>({d,type:pickType(d)})),i:0,correct:0,changes:{}};renderPQ()}}
function pickType(d){const m=mast(d.id);if(m<=1)return pick(['zh2es','listen','shadow']);if(m<=3)return pick(['listen','zh2es','shadow','spell']);return pick(['spell','listen','shadow'])}
function bump(id,delta){const before=mast(id);S.m[id]=Math.max(0,Math.min(5,before+delta));P.changes[id]=(P.changes[id]||0)+delta;save()}
function renderPQ(){const v=$('#v-practica');if(P.i>=P.q.length)return renderPSummary();
  const {d,type}=P.q[P.i];let type2=type;if(type==='listen'&&!canListen())type2='zh2es';
  const head=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="label">第 ${P.i+1} / ${P.q.length} 題</span><button class="btn ghost" id="quitP" style="padding:6px 14px">結束</button></div><div class="progress" style="margin-bottom:22px"><i style="width:${P.i/P.q.length*100}%"></i></div>`;
  let body='';
  if(type2==='listen'){const opts=shuffle([d,...shuffle(D.filter(x=>x.id!==d.id)).slice(0,3)]);
    body=`<div class="qcard"><div class="prompt">聽聽看，這是哪一道？</div><div class="row"><button class="btn" id="play1">${IC.spk}再聽一次</button><button class="btn ghost" id="play2">${IC.slow}慢速</button></div>

  else if(type2==='zh2es'){const opts=shuffle([d,...shuffle(D.filter(x=>x.id!==d.id&&x.cat===d.cat).concat(shuffle(D.filter(x=>x.id!==d.id&&x.cat!==d.cat)))).slice(0,3)]);
    body=`<div class="qcard"><div class="art">${art(d)}</div><div class="prompt">「${d.zh}」的西班牙文是？</div><div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.id===d.id}"><span class="es" style="font-size:.95rem">${o.es}</span></button>`).join('')}</div><div class="feedback" id="fb"></div></div>`}
  else if(type2==='shadow'){body=`<div class="qcard"><div class="art">${art(d)}</div><div><h3 class="es" style="font-size:1.6rem;color:var(--rosa)">${d.es}</h3><div style="font-weight:700">${d.zh}</div></div>
    <div class="syl" style="justify-content:center">${sylHTML(d)}</div><div class="row" style="justify-content:center"><button class="btn" id="play1">${IC.spk}聽一次</button><button class="btn ghost" id="play2">${IC.slow}慢速</button></div>
    <div class="tipbox" style="text-align:left">${d.tip}</div><div class="muted" style="font-size:.9rem">跟著唸三次，重音的音節要拉長、加重。唸完誠實評分：</div>

  else{body=`<div class="qcard"><div class="art">${art(d)}</div><div class="prompt">「${d.zh}」怎麼拼？${canListen()?'可以先聽：':''}</div>${canListen()?`<div class="row"><button class="btn ghost" id="play1">${IC.spk}聽</button><button class="btn ghost" id="play2">${IC.slow}慢速</button></div>`:''}
    <form class="spell" id="spellF"><input id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入西班牙文…" aria-label="輸入西班牙文"><button class="btn" type="submit">確認</button></form><div class="feedback" id="fb"></div></div>`}
  v.innerHTML=head+`<div class="panel">${body}</div>`;
  $('#quitP').onclick=()=>{P.q=P.q.slice(0,P.i);renderPSummary()};
  const p1=$('#play1'),p2=$('#play2');if(p1)p1.onclick=()=>say(d.es,.9);if(p2)p2.onclick=()=>say(d.es,.55);
  if(type2==='listen')setTimeout(()=>say(d.es,.9),250);
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';v.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='true')o.classList.add('ok');const s=o.querySelector('.es-ans');if(s)s.hidden=false});
    if(!ok)b.classList.add('bad');answered(ok,d)});
  v.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{const r=+b.dataset.rate;if(r>0){P.correct++;addPesos(5)}bump(d.id,r);next()});
  const f=$('#spellF');if(f){$('#spellIn').focus();f.onsubmit=e=>{e.preventDefault();const val=$('#spellIn').value;if(!val.trim())return;const ok=norm(val)===norm(d.es);$('#spellIn').disabled=true;f.querySelector('button').disabled=true;answered(ok,d,val)}}}
function answered(ok,d,typed){const fb=$('#fb');
  if(ok){P.correct++;addPesos(5);bump(d.id,1);fb.className='feedback ok pop';fb.textContent='¡Correcto! '+d.es+' — '+d.zh}
  else{bump(d.id,-1);fb.className='feedback bad shake';fb.innerHTML=(typed?`你寫的是「${esc(typed)}」。`:'')+'正確答案：'+d.es+'（'+d.zh+'）'}
  say(d.es,.9);const b=document.createElement('button');b.className='btn';b.style.marginTop='6px';b.textContent='下一題';b.onclick=next;fb.after(b);b.focus()}
function next(){P.i++;renderPQ()}

  v.innerHTML=`<div class="panel" style="display:grid;gap:16px;max-width:560px;margin:0 auto;text-align:center"><h2 class="es" style="color:var(--rosa)">¡Muy bien!</h2>

let R=null,timerRAF=null;
function startRun(id){const loc=LOCS.find(l=>l.id===id);

    extra:pick(loc.extra.opts),spicy:pick(SPICY),soldOut:Math.random()<.35};
  m.clues={drink:clueOf(m.drink,loc),f1:clueOf(m.f1.d,loc),f2:m.f2?clueOf(m.f2.d,loc):'',backup:clueOf(m.backup,loc)};
  R={loc,m,hearts:3,combo:0,earned:0,mistakes:0,step:0,steps:[],log:[],order:[]};
  buildSteps();renderStage();setTimeout(runStep,400)}
function opt(es,zh,ok){return{es,zh,ok}}
function buildSteps(){const {loc,m}=R;const st=[];
  st.push({key:'party',w:loc.greet,opts:shuffle([1,2,3,4].map(n=>opt(PARTY[n],PARTY_ZH[n],n===m.party)))});
  const dr=m.drink,dq=m.party;const otherDr=shuffle(loc.drinks.filter(x=>x!==dr.id).map(x=>byId[x]).concat(D.filter(x=>x.cat==='bebidas'&&!loc.drinks.includes(x.id))));
  const dline=(d,q)=>'Para tomar, '+qty(d,q)+', por favor.';
  const wq=dq===1?2:dq-1;
  st.push({key:'drink',w:{es:'Muy bien. ¿Qué van a tomar?',zh:'好的。要喝什麼？'},opts:shuffle([opt(dline(dr,dq),'喝的要'+dq+'杯'+dr.zh,true),opt(dline(dr,wq),'喝的要'+wq+'杯'+dr.zh,false),opt(dline(otherDr[0],dq),'喝的要'+dq+'杯'+otherDr[0].zh,false),opt(dline(otherDr[1]||otherDr[0],wq),'喝的要'+wq+'杯'+(otherDr[1]||otherDr[0]).zh,false)]),done:'drink'});
  st.push(foodStep('f1',m.f1.d,m.f1.q,'Quiero',{es:'¿Y qué les traigo de comer?',zh:'那要吃點什麼呢？'}));
  if(m.f2)st.push(foodStep('f2',m.f2.d,m.f2.q,'Y también',{es:'¿Algo más?',zh:'還要別的嗎？'}));
  st.push({key:'extra',w:{es:loc.extra.es,zh:loc.extra.zh},opts:shuffle(loc.extra.opts.map(o=>opt(o[1],o[2],o[0]===m.extra[0]))),done:'extra'});
  st.push({key:'spicy',w:{es:'¿Y de salsa? La roja pica mucho, la verde menos.',zh:'辣醬呢？紅的很辣，綠的比較不辣。'},opts:shuffle(SPICY.map(o=>opt(o[1],o[2],o[0]===m.spicy[0]))),done:'spicy'});
  st.push({key:'eat',w:{es:'¡Aquí tienen! ¡Buen provecho!',zh:'來囉！請慢用！'},interlude:true});
  st.push({key:'bill',w:{es:'¿Cómo estuvo todo? ¿Se les ofrece algo más?',zh:'還好吃嗎？還需要什麼嗎？'},prompt:'吃飽了，跟服務生要帳單',opts:shuffle([BILL[0],...shuffle(BILL.slice(1)).slice(0,3)].map(o=>opt(o[1],o[2],o[0]==='ok'))),done:'bill'});
  st.push({key:'price',w:null,price:true});

function foodStep(key,d,q,lead,w){const pool=R.loc.food.map(x=>byId[x]).filter(x=>x.id!==d.id);const others=shuffle(pool);const wq=q===1?2:q===3?2:pick([1,3]);
  const line=(dd,qq)=>lead+' '+qty(dd,qq)+', por favor.';
  return{key,w,opts:shuffle([opt(line(d,q),q+'份'+d.zh,true),opt(line(d,wq),wq+'份'+d.zh,false),opt(line(others[0],q),q+'份'+others[0].zh,false),opt(line(others[1],wq),wq+'份'+others[1].zh,false)]),done:key,dish:{d,q}}}

  <li class="${done('spicy')}">${m.spicy[3]}</li>
  <li class="${done('bill')}">吃完要帳單、聽懂金額</li></ul>
  <div style="font-size:.88rem;border-top:1px dashed var(--sol);padding-top:8px"><b>備案：</b>如果賣完了，改點 ${m.clues.backup} × 1 份</div>`}
function heartsHTML(){let s='<div class="hearts" aria-label="服務生耐心 '+R.hearts+'/3">';for(let i=0;i<3;i++)s+=`<span class="${i<R.hearts?'':'lost'}">${IC.chili}</span>`;return s+'</div>'}
function renderStage(){const v=$('#v-pedir'),{loc}=R;
  v.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><div class="label">${loc.city}</div><h2 class="es" style="color:${loc.color};font-size:1.3rem">${loc.es}</h2></div><div class="row"><button class="btn ghost" id="subsT" style="padding:6px 14px" aria-pressed="${S.subs}">字幕：${S.subs?'開':'關'}</button><button class="btn ghost" id="leave" style="padding:6px 14px">離開</button></div></div>
  <div class="stage"><aside class="mission" id="mission">${missionHTML()}</aside><div><div class="hud"><div id="hearts">${heartsHTML()}</div><div class="combo" id="combo"></div><div class="chip">${IC.coin}<span id="earned">+0</span></div></div>
  <div class="timer"><i id="tbar"></i></div><div class="chat" id="chat" aria-live="polite"></div><div id="ctrl" style="margin-top:12px"></div></div></div>`;
  $('#leave').onclick=()=>{stopTimer();if(hasTTS)speechSynthesis.cancel();renderLocs()};
  $('#subsT').onclick=e=>{S.subs=!S.subs;save();e.target.textContent='字幕：'+(S.subs?'開':'關');e.target.setAttribute('aria-pressed',S.subs);document.querySelectorAll('.bubble[data-sub]').forEach(b=>b.querySelector('.t').classList.toggle('hidden-sub',!S.subs&&b.dataset.sub!=='always'))}}
function addMsg(who,es,zh,opts={}){const chat=$('#chat');if(!chat)return;const el=document.createElement('div');el.className='msg pop'+(who==='me'?' me':'');
  const hide=who==='w'&&!opts.always&&(!S.subs||opts.hide);
  el.innerHTML=`<div class="avatar">${who==='me'?meAvatar:avatar(R.loc)}</div><div class="bubble" ${who==='w'?`data-sub="${opts.always?'always':'w'}"`:''}><div class="who">${who==='me'?'你':R.loc.waiter}</div><div class="t ${hide?'hidden-sub':''}">${esc(es)}</div>${zh?`<div class="z">${esc(zh)}</div>`:''}<button class="redo">${IC.spk.replace('<svg','<svg width="14" height="14"')}重聽</button></div>`;
  el.querySelector('.redo').onclick=()=>say(es,.85);chat.appendChild(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});return el}
function addEvent(text){const chat=$('#chat');const el=document.createElement('div');el.className='event pop';el.textContent=text;chat.appendChild(el);el.scrollIntoView({block:'nearest'})}

function runStep(){if(!R||currentView!=='pedir')return;const st=R.steps[R.step];if(!st)return finishRun(true);
  const ctrl=$('#ctrl');ctrl.innerHTML='';
  if(st.interlude){addMsg('w',st.w.es,S.subs?st.w.zh:'');say(st.w.es,.9);addEvent('（滋滋作響的料理上桌了，好好享用…）');
    ctrl.innerHTML='<button class="btn" id="ate">吃飽了，繼續</button>';$('#ate').onclick=()=>{R.step++;runStep()};return}
  if(st.price)return priceStep();
  const wEl=addMsg('w',st.w.es,S.subs?st.w.zh:'');
  const rate=R.loc.time<=20?1:.92;
  if(st.prompt)addEvent(st.prompt);
  ctrl.innerHTML=`<div class="opts">${st.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.es)}</button>`).join('')}</div>`;
  ctrl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(st,+b.dataset.i));
  say(st.w.es,rate,()=>startTimer(R.loc.time,()=>choose(st,-1)))}
function startTimer(sec,onTimeout){stopTimer();const bar=$('#tbar');if(!bar)return;const t0=performance.now();
  const tick=now=>{const p=1-(now-t0)/(sec*1000);if(!document.body.contains(bar))return;bar.style.width=Math.max(0,p*100)+'%';bar.classList.toggle('low',p<.3);
    if(p<=0){timerRAF=null;onTimeout();return}timerRAF=requestAnimationFrame(tick)};timerRAF=requestAnimationFrame(tick)}
function stopTimer(){if(timerRAF)cancelAnimationFrame(timerRAF);timerRAF=null}
function choose(st,i){stopTimer();const ctrl=$('#ctrl');const btns=ctrl.querySelectorAll('.opt');if(!btns.length||btns[0].disabled)return;
  btns.forEach((b,k)=>{b.disabled=true;if(st.opts[k].ok)b.classList.add('ok')});
  const right=st.opts.find(o=>o.ok);const ok=i>=0&&st.opts[i].ok;
  if(ok){R.combo++;const gain=10+5*Math.min(R.combo-1,4);R.earned+=gain;$('#earned').textContent='+'+R.earned;
    $('#combo').textContent=R.combo>=2?'¡Combo ×'+R.combo+'!':'';}
  else{btns[i]?.classList.add('bad');R.combo=0;R.mistakes++;R.hearts--;$('#combo').textContent='';$('#hearts').innerHTML=heartsHTML();$('#hearts').classList.add('shake');setTimeout(()=>$('#hearts')?.classList.remove('shake'),400);
    addEvent(i<0?'時間到！服務生不耐煩地敲了敲筆記本。':'你剛剛說的是：「'+st.opts[i].zh+'」　服務生一臉困惑。')}
  addMsg('me',right.es,right.zh);say(right.es,.9);
  if(st.done){R.log.push(st.done);$('#mission').innerHTML=missionHTML()}
  if(st.dish)R.order.push(st.dish);
  if(R.hearts<=0){setTimeout(()=>finishRun(false),1400);return}
  // sold-out twist after first dish
  if(st.key==='f1'&&R.m.soldOut){setTimeout(()=>{R.order.pop();const d=R.m.f1.d;
    const fs=foodStep('backup',R.m.backup,1,'Entonces',{es:'Uy, perdón, ya no hay '+d.es.toLowerCase()+'. Se nos acabó. ¿Quiere otra cosa?',zh:'哎呀抱歉，'+d.zh+'賣完了。要換別的嗎？'});
    R.steps.splice(R.step+1,0,fs);addEvent('突發狀況：'+d.zh+'賣完了！看看任務卡的備案。');advance(ok)},1300);return}
  advance(ok)}
function advance(ok){const go=()=>{R.step++;runStep()};
  if(ok)setTimeout(go,1700);else{$('#ctrl').insertAdjacentHTML('beforeend','<div class="row" style="margin-top:10px"><button class="btn" id="goOn">知道了，繼續</button></div>');$('#goOn').onclick=go;$('#goOn').focus()}}
function total(){let t=R.m.drink.price*R.m.party;R.order.forEach(o=>t+=o.d.price*o.q);return t}
function priceStep(){const t=total();const words='Son '+numEs(t)+' pesos.';
  const set=new Set([t]);const cand=[t+10,t-10,t+20,t-20,t+50,t-50,t+100,t-5,t+5];
  const sw=String(t);if(sw.length===3&&sw[1]!==sw[2]){const s2=+(sw[0]+sw[2]+sw[1]);if(s2%5===0)cand.unshift(s2)}
  for(const c of shuffle(cand.slice(1)).concat(cand[0]?[cand[0]]:[])){if(set.size>=4)break;if(c>0)set.add(c)}
  const opts=shuffle([...set]);
  addMsg('w',words,'',{hide:canListen(),always:!canListen()});addEvent('仔細聽：總共多少錢？');
  const ctrl=$('#ctrl');ctrl.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="replay">${IC.spk}再聽一次</button></div><div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}" style="font-variant-numeric:tabular-nums;font-size:1.15rem">$${o}</button>`).join('')}</div>`;
  $('#replay').onclick=()=>say(words,.8);
  const st={opts:opts.map(o=>({es:'Aquí tiene, $'+o+'.',zh:'這是 '+o+' 披索。',ok:o===t}))};
  ctrl.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>{revealPrice();choose(st,k)});
  say(words,.9,()=>startTimer(R.loc.time+6,()=>{revealPrice();choose(st,-1)}))}
function revealPrice(){document.querySelectorAll('.bubble .t.hidden-sub').forEach(e=>e.classList.remove('hidden-sub'));const bs=document.querySelectorAll('.bubble');const last=[...bs].reverse().find(b=>b.dataset.sub);if(last&&!last.querySelector('.z')){last.querySelector('.t').insertAdjacentHTML('afterend','<div class="z">總共 '+total()+' 披索（'+numEs(total())+'）</div>')}}

function finishRun(won){stopTimer();const {loc,m}=R;const v=$('#v-pedir');S.runs++;markDay();
  let stars=0;if(won){stars=R.mistakes===0?3:R.mistakes===1?2:1}
  const prevTot=totalStars();if(stars>(S.stars[loc.id]||0))S.stars[loc.id]=stars;if(stars===3)S.perfect++;
  const tip=won?stars*10:0;const gained=R.earned+tip;S.pesos+=gained;save();renderStats();
  const unlocked=LOCS.filter(l=>l.need>prevTot&&l.need<=totalStars());
  const t=total();
  if(won){say(stars===3?'¡Gracias! ¡Vuelvan pronto, amigos!':'Gracias, que les vaya bien.',.9)}else{say('¡Ay, joven! Mejor regrese mañana.',.9)}
  v.innerHTML=`<div style="display:grid;gap:18px">${won?`<div class="receipt pop"><h3>${loc.es}</h3><div class="muted" style="text-align:center;font-size:.85rem">LA CUENTA · ${loc.city}</div><div style="margin-top:12px">
  <div class="line"><span>${m.party} × ${m.drink.es}</span><span>$${m.drink.price*m.party}</span></div>${R.order.map(o=>`<div class="line"><span>${o.q} × ${o.d.es}</span><span>$${o.d.price*o.q}</span></div>`).join('')}
  <div class="line tot"><span>Total</span><span>$${t}</span></div></div>${starsHTML(stars)}
  <div style="text-align:center;font-weight:800">${stars===3?'¡Perfecto! 服務生說你點得像本地人。':stars===2?'¡Muy bien! 只差一點點。':'Bien. 吃到了，但服務生有點累。'}</div>
  <div class="muted" style="text-align:center;font-size:.9rem;margin-top:6px">答題獲得 ${R.earned} 披索 ＋ 小費獎勵 ${tip} 披索</div></div>`:
  `<div class="panel pop" style="text-align:center;display:grid;gap:10px;max-width:480px;margin:0 auto"><div style="width:80px;margin:0 auto">${avatar(loc)}</div><h2 class="es" style="color:var(--chile)">¡Ay, joven!</h2><p style="margin:0">Mejor regrese mañana.<br><span class="muted">「唉，年輕人，你明天再來吧。」服務生的耐心用完了。</span></p><p class="muted" style="margin:0">這趟獲得 ${R.earned} 披索。先去「發音練習」複習這家店的菜，再回來挑戰！</p></div>`}
  ${unlocked.length?`<div class="event" style="background:var(--verde-soft);color:var(--verde)">新餐廳解鎖：${unlocked.map(l=>l.es).join('、')}</div>`:''}
  <div class="row" style="justify-content:center"><button class="btn" id="retry">再來一次（新任務）</button><button class="btn ghost" id="back">選別家餐廳</button><button class="btn ghost" id="study">複習這家店的菜</button></div></div>`;
  $('#retry').onclick=()=>startRun(loc.id);$('#back').onclick=renderLocs;
  $('#study').onclick=()=>{const q=loc.food.concat(loc.drinks).map(id=>byId[id]);show('practica');P={q:shuffle(q).slice(0,8).map(d=>({d,type:pickType(d)})),i:0,correct:0,changes:{}};renderPQ()};
  R=null}

/* ---------------- passport ---------------- */
const BADGES=[
{id:'first',zh:'第一次點餐',es:'Primer pedido',ok:()=>S.runs>=1},
{id:'perfect',zh:'完美點餐（三星）',es:'¡Perfecto!',ok:()=>S.perfect>=1},
{id:'streak3',zh:'連續練習 3 天',es:'Tres días seguidos',ok:()=>S.streak.n>=3},
{id:'streak7',zh:'連續練習 7 天',es:'Una semana',ok:()=>S.streak.n>=7},
{id:'ten',zh:'記住 10 道菜',es:'Diez platillos',ok:()=>D.filter(d=>mast(d.id)>=4).length>=10},
{id:'all5',zh:'解鎖全部五家餐廳',es:'Turista experto',ok:()=>totalStars()>=LOCS[LOCS.length-1].need},
{id:'rich',zh:'存到 1000 披索',es:'Mil pesos',ok:()=>S.pesos>=1000},
{id:'master',zh:'記住全部料理',es:'Chef honorario',ok:()=>D.every(d=>mast(d.id)>=4)}];
function renderPass(){const v=$('#v-pasaporte');const mastered=D.filter(d=>mast(d.id)>=4).length;
  v.innerHTML=`<div class="view-head"><div><h2>我的護照 · Pasaporte</h2><p>熟練度滿 4 格的料理會變成彩色貼紙。目標：集滿 ${D.length} 張。</p></div></div>
  <div class="kpis"><div class="kpi"><span class="label">記住的料理</span><b>${mastered}/${D.length}</b></div><div class="kpi"><span class="label">點餐星星</span><b>${totalStars()}/${LOCS.length*3}</b></div><div class="kpi"><span class="label">連續天數</span><b>${S.streak.n}</b></div><div class="kpi"><span class="label">披索</span><b>${S.pesos}</b></div></div>
  <div class="label" style="margin-bottom:8px">成就</div><div class="badges">${BADGES.map(b=>{const ok=b.ok();return `<div class="bdg ${ok?'':'locked'}"><span class="seal">${ok?'✓':'?'}</span><div><b>${b.zh}</b><div class="muted" style="font-size:.85rem">${b.es}</div></div></div>`}).join('')}</div>
  <div class="label" style="margin-bottom:8px">料理貼紙</div><div class="pass-grid">${D.map(d=>{const ok=mast(d.id)>=4;return `<button class="sticker ${ok?'':'locked'}" data-id="${d.id}" aria-label="${d.es}">${art(d,false)}<div>${ok?d.es:d.zh}</div></button>`}).join('')}</div>
  <div style="margin-top:24px" id="resetBox"><button class="btn ghost" id="reset">重設所有進度</button></div>
  <p class="note" style="margin-top:12px">進度存在這個瀏覽器裡。換裝置或清除瀏覽資料會從頭開始。</p>`;
  v.querySelectorAll('.sticker').forEach(b=>b.onclick=()=>openDish(b.dataset.id));
  $('#reset').onclick=()=>{$('#resetBox').innerHTML='<div class="row"><span style="font-weight:700">確定要清除所有熟練度、星星和披索嗎？</span><button class="btn" id="resetYes" style="background:var(--chile)">確定清除</button><button class="btn ghost" id="resetNo">取消</button></div>';
    $('#resetYes').onclick=()=>{S=blank();save();renderStats();renderPass();toast('進度已清除')};$('#resetNo').onclick=renderPass}}

/* ---------------- boot ---------------- */
picado();renderStats();renderMenu();
</script>
</body>
</html>
